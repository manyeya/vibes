name: Deploy Vibes documentation
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs-site/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vibes-docs-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build documentation and validate links
        run: node apps/docs-site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-site/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
